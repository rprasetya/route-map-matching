name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release and publish, for example v1.0.0
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Release notes from the changelog
        run: awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: notes.md
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm with trusted publishing
        run: npm publish --provenance --access public
